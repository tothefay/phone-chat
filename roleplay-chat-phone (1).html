async function gen(){if(!S.keys.length){toast('ใส่คีย์ API ก่อน');return}busy=true;ctl=new AbortController();const a={t:'',th:'',d:new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})};msgs().push(a);render();

  else add(await r.json());
